<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kim Bảo Di - Charm Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes magicBling {
      0% { transform: scale(0.5); opacity: 0; filter: brightness(1); }
      50% { transform: scale(1.4); opacity: 1; filter: brightness(2) drop-shadow(0 0 15px gold); }
      100% { transform: scale(1); opacity: 1; filter: brightness(1); }
    }
    .bling-effect {
      animation: magicBling 0.8s ease-in-out;
    }
  </style>
</head>
<body class="bg-[#FFF5F6] text-gray-700 min-h-screen font-sans select-none">
  <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-2xl relative">
    
    <!-- HEADER -->
    <header class="p-4 text-center bg-white border-b border-pink-100 sticky top-0 z-20">
      <h1 class="text-xl font-bold text-pink-500 tracking-wider uppercase">KIMBAODI JEWELRY</h1>
      <p class="text-xs text-gray-400">Tự tay thiết kế vòng tay độc bản</p>
    </header>

    <!-- KHUNG VÒNG TAY (ĐÃ DỊCH CHUYỂN VÒNG VÀ TÂM CHARM LÊN TRÊN) -->
    <div class="p-4 flex flex-col items-center bg-[#FFF5F6] relative">
      <div class="relative w-72 h-72 bg-white rounded-3xl shadow-sm border border-pink-100 flex items-center justify-center overflow-hidden">
        
        <!-- Ảnh vòng nền dịch chuyển nhích lên trên (object-position hoặc padding) -->
        <img src="https://i.postimg.cc/hvNZnkTM/IMG-0847.png" alt="Vòng tay Kim Bảo Di" class="absolute w-full h-full object-contain pointer-events-none p-1 -top-2" />

        <!-- CÁC HẠT CHARM KHỚP CHUẨN VÀO DÂY VÒNG -->
        <div id="bracelet-ring" class="absolute inset-0 w-full h-full pointer-events-none"></div>

        <!-- HIỆU ỨNG PHÉP THUẬT BLING BLING -->
        <div id="magic-sparkle" class="absolute pointer-events-none inset-0 flex items-center justify-center transition-opacity duration-300 opacity-0">
          <span class="text-3xl animate-ping">✨</span>
        </div>
      </div>

      <p class="text-xs text-gray-400 mt-3 text-center">
        Đã chọn <span id="count-text" class="font-bold text-pink-500">0</span> charm | Chạm vào số thứ tự để đổi chỗ
      </p>
    </div>

    <!-- MENU CHỌN CHARM -->
    <div class="flex-1 bg-white rounded-t-3xl p-4 border-t border-pink-100 shadow-lg flex flex-col">
      <!-- TAB DANH MỤC -->
      <div id="tabs-container" class="flex gap-2 border-b border-gray-100 pb-2 mb-3 overflow-x-auto no-scrollbar"></div>

      <!-- LƯỚI CHARM -->
      <div id="charms-grid" class="grid grid-cols-4 gap-3 overflow-y-auto max-h-56 p-1"></div>

      <!-- THANH TỔNG TIỀN & CHỐT ĐƠN -->
      <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
        <div>
          <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Tổng tiền (Vòng + Charm)</p>
          <p id="total-price" class="text-lg font-extrabold text-pink-600">119,000 đ</p>
        </div>
        <button onclick="sendOrderZalo()" class="bg-pink-500 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-pink-200 active:scale-95 transition">
          Chốt Đơn Zalo 💬
        </button>
      </div>
    </div>
  </div>

  <script>
    const ZALO_PHONE = "0775812305"; 
    const braceletPrice = 119000;

    const CHARM_CATEGORIES = [
      {
        category: "Hello Kitty",
        items: [
          { id: "kitty-1", name: "Kitty Vương Miện", price: 238000, img: "https://i.postimg.cc/YS7BcWzJ/IMG-0746.png" },
          { id: "kitty-2", name: "Kitty Nơ Đỏ", price: 238000, img: "https://i.postimg.cc/s2zCFh4b/IMG-0747.png" },
          { id: "kitty-3", name: "Kitty Thỏi Vàng", price: 238000, img: "https://i.postimg.cc/vmywRVtk/IMG-0748.png" },
          { id: "kitty-4", name: "Nơ Đỏ Thắt", price: 238000, img: "https://i.postimg.cc/SK4b0Mf5/IMG-0749.png" }
        ]
      },
      {
        category: " dễ thương",
        items: [
          { id: "spoon", name: "Muỗng Vàng", price: 238000, img: "https://i.postimg.cc/SK4b0Mf5/IMG-0749.png",isDangling: true },
          { id: "balloon", name: "Kitty Bong Bóng", price: 238000, img: "https://i.postimg.cc/5tJWcCSs/IMG-0750.png",isDangling: true }
        ]
      }
    ];

    let userCharms = []; 
    let currentTab = CHARM_CATEGORIES[0].category;
    let selectedIndexToSwap = null;

    function addCharm(charm) {
      if (userCharms.length >= 7) {
        alert("Vòng đã đạt tối đa số lượng charm!");
        return;
      }
      userCharms.push(charm);
      triggerMagicEffect();
      updateUI();
    }

    function triggerMagicEffect() {
      const sparkle = document.getElementById('magic-sparkle');
      sparkle.classList.remove('opacity-0');
      sparkle.classList.add('opacity-100', 'bling-effect');
      setTimeout(() => {
        sparkle.classList.remove('opacity-100', 'bling-effect');
        sparkle.classList.add('opacity-0');
      }, 800);
    }

    function handleCharmClick(index) {
      if (selectedIndexToSwap === null) {
        selectedIndexToSwap = index;
        updateUI();
      } else {
        let temp = userCharms[selectedIndexToSwap];
        userCharms[selectedIndexToSwap] = userCharms[index];
        userCharms[index] = temp;
        selectedIndexToSwap = null;
        updateUI();
      }
    }

    function removeCharm(event, index) {
      event.stopPropagation();
      userCharms.splice(index, 1);
      selectedIndexToSwap = null;
      updateUI();
    }

               function renderBracelet() {
      const container = document.getElementById('bracelet-ring');
      container.innerHTML = '';
      
      const total = userCharms.length;
      document.getElementById('count-text').innerText = total;

      const angleStep = 0.35; 
      const baseCenterAngle = Math.PI / 2; // Đáy vòng (90 độ)
      const startAngle = baseCenterAngle - ((total - 1) * angleStep) / 2;

      userCharms.forEach((charm, index) => {
        const angle = total === 1 ? baseCenterAngle : startAngle + index * angleStep;

        const radius = 118; 
        const charmSize = 32; 
        
        const x = 144 + radius * Math.cos(angle) - charmSize / 2; 
        const y = 138 + radius * Math.sin(angle) - charmSize / 2;

        const isSelected = selectedIndexToSwap === index;
        const charmEl = document.createElement('div');
        charmEl.className = `absolute pointer-events-auto cursor-pointer transition-all duration-300 ${isSelected ? 'scale-125 z-40' : 'z-20'}`;
        
        charmEl.style.left = `${x}px`;
        charmEl.style.top = `${y}px`;

        if (charm.isDangling) {
          // --- XỬ LÝ RIÊNG CHO CHARM TÒN TENG ---
          // Không xoay theo đường cong mà để đứng thẳng tự nhiên (hoặc lắc lư nhẹ), 
          // điểm neo bám vào đúng đỉnh đầu khoen charm.
          charmEl.style.transform = `translate(0, 0)`; // Đính đúng vị trí dây
          charmEl.innerHTML = `
            <div class="relative flex flex-col items-center justify-center w-[32px] h-[44px]">
              <!-- Ảnh charm tòn teng dài hơn một chút xuống dưới -->
              <img src="${charm.img}" class="w-8 h-12 object-contain drop-shadow-[0_3px_5px_rgba(0,0,0,0.4)] ${isSelected ? 'animate-bounce' : ''}" style="transform-origin: top center;" />
              
              <!-- Badge số và nút xóa nằm gọn gàng bên cạnh -->
              <span class="absolute -bottom-2 bg-pink-500 text-white rounded-full w-4 h-4 text-[9px] font-bold flex items-center justify-center shadow z-30 pointer-events-auto">
                ${index + 1}
              </span>
              <button onclick="removeCharm(event, ${index})" class="absolute -top-3 -right-2 bg-red-500 text-white rounded-full w-4 h-4 text-[9px] flex items-center justify-center shadow z-30 pointer-events-auto">
                ✕
              </button>
            </div>
          `;
        } else {
          // --- CHARM THƯỜNG (XOAY THEO VÒNG) ---
          const rotationDeg = (angle - Math.PI / 2) * (180 / Math.PI);
          charmEl.style.transform = `rotate(${rotationDeg}deg)`;

          charmEl.innerHTML = `
            <div class="relative flex flex-col items-center justify-center w-[32px] h-[32px]">
              <img src="${charm.img}" class="w-full h-full object-contain drop-shadow-[0_2px_4px_rgba(0,0,0,0.4)] ${isSelected ? 'animate-bounce' : ''}" />
              
              <div style="transform: rotate(${-rotationDeg}deg)" class="absolute inset-0 pointer-events-none flex items-center justify-center">
                <span class="absolute -bottom-3 bg-pink-500 text-white rounded-full w-4 h-4 text-[9px] font-bold flex items-center justify-center shadow z-30 pointer-events-auto">
                  ${index + 1}
                </span>
                <button onclick="removeCharm(event, ${index})" class="absolute -top-3 -right-2 bg-red-500 text-white rounded-full w-4 h-4 text-[9px] flex items-center justify-center shadow z-30 pointer-events-auto">
                  ✕
                </button>
              </div>
            </div>
          `;
        }

        charmEl.onclick = () => handleCharmClick(index);
        container.appendChild(charmEl);
      });
    }



    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      CHARM_CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
          currentTab === cat.category ? 'bg-pink-500 text-white shadow-sm' : 'bg-gray-100 text-gray-500'
        }`;
        btn.innerText = cat.category;
        btn.onclick = () => { currentTab = cat.category; renderCharms(); };
        container.appendChild(btn);
      });
    }

    function renderCharms() {
      renderTabs();
      const container = document.getElementById('charms-grid');
      container.innerHTML = '';
      const catData = CHARM_CATEGORIES.find(c => c.category === currentTab);
      if (!catData) return;

      catData.items.forEach(charm => {
        const btn = document.createElement('button');
        btn.className = 'flex flex-col items-center bg-pink-50/40 p-2 rounded-xl border border-pink-100 hover:bg-pink-100 transition active:scale-95';
        btn.onclick = () => addCharm(charm);
        btn.innerHTML = `
          <img src="${charm.img}" class="w-10 h-10 object-contain mb-1" />
          <span class="text-[10px] font-medium text-gray-600 truncate w-full text-center">${charm.name}</span>
          <span class="text-[9px] text-pink-500 font-bold">${charm.price / 1000}k</span>
        `;
        container.appendChild(btn);
      });
    }

    function calculateTotal() {
      const charmTotal = userCharms.reduce((acc, item) => acc + item.price, 0);
      const total = braceletPrice + charmTotal;
      document.getElementById('total-price').innerText = total.toLocaleString() + ' đ';
      return total;
    }

    function updateUI() {
      renderBracelet();
      renderCharms();
      calculateTotal();
    }

    function sendOrderZalo() {
      if (userCharms.length === 0) {
        alert("Bạn chưa chọn charm nào lên vòng!");
        return;
      }
      let msg = `✨ ĐƠN THIẾT KẾ VÒNG KIM BẢO DI ✨\n--------------------------\n`;
      msg += `1. Dây vòng bạc: ${braceletPrice.toLocaleString()}đ\n2. Danh sách charm đính kèm:\n`;
      userCharms.forEach((item, idx) => {
        msg += `  • Vị trí ${idx + 1}: ${item.name} (${item.price.toLocaleString()}đ)\n`;
      });
      msg += `--------------------------\n💰 TỔNG TIỀN: ${calculateTotal().toLocaleString()} VNĐ\n\nShop tư vấn và chốt đơn giúp mình nhé!`;
      
      window.open(`https://zalo.me/${ZALO_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    updateUI();
  </script>
</body>
</html>
