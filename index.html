<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kim Bảo Di - Charm Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FFF5F6] text-gray-700 min-h-screen font-sans">
  <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-2xl relative">
    
    <!-- HEADER -->
    <header class="p-4 text-center bg-white border-b border-pink-100 sticky top-0 z-20">
      <h1 class="text-xl font-bold text-pink-500 tracking-wider uppercase">KIMBAODI JEWELRY</h1>
      <p class="text-xs text-gray-400">Tự tay thiết kế vòng tay độc bản</p>
    </header>

    <!-- KHUNG VÒNG TAY VÀ CHARM XỎ TRÊN VÒNG -->
    <div class="p-4 flex flex-col items-center bg-[#FFF5F6]">
      <div class="relative w-72 h-72 bg-white rounded-3xl shadow-sm border border-pink-100 flex items-center justify-center overflow-hidden">
        
        <!-- Ảnh vòng nền thực tế của tiệm -->
        <img src="https://i.postimg.cc/hvNZnkTM/IMG-0847.png" alt="Vòng tay Kim Bảo Di" class="absolute w-full h-full object-contain pointer-events-none p-2" />

        <!-- CÁC HẠT CHARM XỎ CHUẨN TRÊN ĐƯỜNG VIỀN VÒNG -->
        <div id="bracelet-ring" class="absolute inset-0 w-full h-full pointer-events-none"></div>
      </div>

      <p class="text-xs text-gray-400 mt-3 text-center">
        Đã chọn <span id="count-text" class="font-bold text-pink-500">0</span> charm (Chạm vào `✕` trên hạt để gỡ)
      </p>
    </div>

    <!-- MENU CHỌN CHARM -->
    <div class="flex-1 bg-white rounded-t-3xl p-4 border-t border-pink-100 shadow-lg flex flex-col">
      <!-- TAB DANH MỤC -->
      <div id="tabs-container" class="flex gap-2 border-b border-gray-100 pb-2 mb-3 overflow-x-auto no-scrollbar"></div>

      <!-- LƯỚI CHARM -->
      <div id="charms-grid" class="grid grid-cols-4 gap-3 overflow-y-auto max-h-56 p-1"></div>

      <!-- THANH TỔNG TIỀN & CHỐT ĐƠN -->
      <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
        <div>
          <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Tổng tiền (Vòng + Charm)</p>
          <p id="total-price" class="text-lg font-extrabold text-pink-600">119,000 đ</p>
        </div>
        <button onclick="sendOrderZalo()" class="bg-pink-500 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-pink-200 active:scale-95 transition">
          Chốt Đơn Zalo 💬
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. THÔNG TIN TIỆM
    const ZALO_PHONE = "0775812305"; 
    const braceletPrice = 119000;    // Giá dây vòng cơ bản

    // 2. DANH SÁCH SẢN PHẨM THẬT CỦA TIỆM
    const CHARM_CATEGORIES = [
      {
        category: "Hello Kitty",
        items: [
          { id: "kitty-1", name: "Kitty Vương Miện", price: 238000, img: "https://i.postimg.cc/YS7BcWzJ/IMG-0746.png" },
          { id: "kitty-2", name: "Kitty Nơ Đỏ", price: 238000, img: "https://i.postimg.cc/s2zCFh4b/IMG-0747.png" },
          { id: "kitty-3", name: "Kitty Thỏi Vàng", price: 238000, img: "https://i.postimg.cc/vmywRVtk/IMG-0748.png" },
          { id: "kitty-4", name: "Nơ Đỏ Thắt", price: 238000, img: "https://i.postimg.cc/SK4b0Mf5/IMG-0749.png" }
        ]
      },
      {
        category: "Biểu Tượng",
        items: [
          { id: "spoon", name: "Muỗng Vàng", price: 238000, img: "https://i.postimg.cc/SK4b0Mf5/IMG-0749.png" },
          { id: "balloon", name: "Kitty Bong Bóng", price: 238000, img: "https://i.postimg.cc/5tJWcCSs/IMG-0750.png" }
        ]
      }
    ];

    let userCharms = []; 
    let currentTab = CHARM_CATEGORIES[0].category;

    // Thêm charm vào vòng (tối đa 8 charm)
    function addCharm(charm) {
      if (userCharms.length >= 8) {
        alert("Vòng đã đạt tối đa số lượng charm!");
        return;
      }
      userCharms.length === 0 ? userCharms.push(charm) : userCharms.splice(Math.floor(userCharms.length / 2) + 1, 0, charm);
      updateUI();
    }

    // Gỡ charm ra khỏi vòng
    function removeCharm(index) {
      userCharms.splice(index, 1);
      updateUI();
    }

    // Sắp xếp các charm ôm sát và bám đều quanh vòng tròn (tập trung nửa dưới giống ảnh mẫu)
    function renderBracelet() {
      const container = document.getElementById('bracelet-ring');
      container.innerHTML = '';
      
      const total = userCharms.length;
      document.getElementById('count-text').innerText = total;

      userCharms.forEach((charm, index) => {
        // Phân bổ các charm tập trung chủ yếu ở phần dưới của vòng (từ góc phải qua trái giống ảnh mẫu)
        const angleStep = 0.55; 
        const startAngle = Math.PI / 2 - (total * angleStep) / 2;
        const angle = startAngle + index * angleStep;

        const radius = 94; // Bán kính chuẩn khớp khít với vòng trên ảnh
        const x = 144 + radius * Math.cos(angle) - 20; 
        const y = 144 + radius * Math.sin(angle) - 20;

        const charmEl = document.createElement('div');
        charmEl.className = 'absolute pointer-events-auto cursor-pointer transition-all hover:scale-110';
        charmEl.style.left = `${x}px`;
        charmEl.style.top = `${y}px`;
        charmEl.innerHTML = `
          <div class="relative">
            <img src="${charm.img}" class="w-11 h-11 object-contain drop-shadow-md bg-white/60 rounded-full p-0.5" />
            <button onclick="removeCharm(${index})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[9px] flex items-center justify-center shadow">✕</button>
          </div>
        `;
        container.appendChild(charmEl);
      });
    }

    // Hiển thị danh mục tab
    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      CHARM_CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
          currentTab === cat.category ? 'bg-pink-500 text-white shadow-sm' : 'bg-gray-100 text-gray-500'
        }`;
        btn.innerText = cat.category;
        btn.onclick = () => { currentTab = cat.category; renderCharms(); };
        container.appendChild(btn);
      });
    }

    // Hiển thị danh sách charm để khách chọn
    function renderCharms() {
      renderTabs();
      const container = document.getElementById('charms-grid');
      container.innerHTML = '';
      const catData = CHARM_CATEGORIES.find(c => c.category === currentTab);
      if (!catData) return;

      catData.items.forEach(charm => {
        const btn = document.createElement('button');
        btn.className = 'flex flex-col items-center bg-pink-50/40 p-2 rounded-xl border border-pink-100 hover:bg-pink-100 transition active:scale-95';
        btn.onclick = () => addCharm(charm);
        btn.innerHTML = `
          <img src="${charm.img}" class="w-10 h-10 object-contain mb-1" />
          <span class="text-[10px] font-medium text-gray-600 truncate w-full text-center">${charm.name}</span>
          <span class="text-[9px] text-pink-500 font-bold">${charm.price / 1000}k</span>
        `;
        container.appendChild(btn);
      });
    }

    // Tự động tính tổng tiền (Giá vòng + Tổng giá charm đã chọn)
    function calculateTotal() {
      const charmTotal = userCharms.reduce((acc, item) => acc + item.price, 0);
      const total = braceletPrice + charmTotal;
      document.getElementById('total-price').innerText = total.toLocaleString() + ' đ';
      return total;
    }

    function updateUI() {
      renderBracelet();
      renderCharms();
      calculateTotal();
    }

    // Gửi thông tin đơn hàng qua Zalo
    function sendOrderZalo() {
      if (userCharms.length === 0) {
        alert("Bạn chưa chọn charm nào lên vòng!");
        return;
      }
      let msg = `✨ ĐƠN THIẾT KẾ VÒNG KIM BẢO DI ✨\n--------------------------\n`;
      msg += `1. Dây vòng bạc: ${braceletPrice.toLocaleString()}đ\n2. Danh sách charm đính kèm:\n`;
      userCharms.forEach((item, idx) => {
        msg += `  • Charm ${idx + 1}: ${item.name} (${item.price.toLocaleString()}đ)\n`;
      });
      msg += `--------------------------\n💰 TỔNG TIỀN: ${calculateTotal().toLocaleString()} VNĐ\n\nShop tư vấn và chốt đơn giúp mình nhé!`;
      
      window.open(`https://zalo.me/${ZALO_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    updateUI();
  </script>
</body>
</html>
