<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kim Bảo Di - Charm Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FFF5F6] text-gray-700 min-h-screen font-sans">
  <div class="max-w-md mx-auto min-h-screen flex flex-col bg-white shadow-2xl relative">
    
    <!-- HEADER -->
    <header class="p-4 text-center bg-white border-b border-pink-100 sticky top-0 z-20">
      <h1 class="text-xl font-bold text-pink-500 tracking-wider uppercase">KIMBAODI JEWELRY</h1>
      <p class="text-xs text-gray-400">Tự tay phối charm theo phong cách của bạn</p>
    </header>

    <!-- KHUNG XEM THỬ VÒNG -->
    <div class="p-4 flex flex-col items-center bg-[#FFF5F6]">
      <div class="relative w-72 h-72 bg-white rounded-3xl shadow-sm border border-pink-100 flex items-center justify-center overflow-hidden">
        <!-- Ảnh vòng nền (Bạn có thể thay link ảnh vòng thật của tiệm vào chỗ này) -->
        <img id="bracelet-img" src="https://via.placeholder.com/400/F0F0F0/000000?text=Vong+Bac" alt="Vòng" class="absolute w-full h-full object-contain pointer-events-none p-4" />

        <!-- Các vị trí đính charm -->
        <div id="slots-container" class="absolute inset-0 flex items-center justify-center gap-2 px-6"></div>
      </div>

      <p class="text-xs text-gray-400 mt-3">
        Đang đính vào <span id="active-slot-text" class="font-bold text-pink-500">Vị trí 1</span> (Chạm vào số để đổi vị trí)
      </p>
    </div>

    <!-- MENU CHỌN CHARM -->
    <div class="flex-1 bg-white rounded-t-3xl p-4 border-t border-pink-100 shadow-lg flex flex-col">
      <!-- TAB DANH MỤC -->
      <div id="tabs-container" class="flex gap-2 border-b border-gray-100 pb-2 mb-3 overflow-x-auto no-scrollbar"></div>

      <!-- LƯỚI CHARM -->
      <div id="charms-grid" class="grid grid-cols-4 gap-3 overflow-y-auto max-h-56 p-1"></div>

      <!-- THANH TỔNG TIỀN & CHỐT ĐƠN -->
      <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
        <div>
          <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Tạm tính</p>
          <p id="total-price" class="text-lg font-extrabold text-pink-600">180,000 đ</p>
        </div>
        <button onclick="sendOrderZalo()" class="bg-pink-500 text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-pink-200 active:scale-95 transition">
          Chốt Đơn Zalo 💬
        </button>
      </div>
    </div>
  </div>

  <script>
    // 1. SỐ ĐIỆN THOẠI ZALO NHẬN ĐƠN CỦA TIỆM
    const ZALO_PHONE = "0901234567"; // Thay SĐT Zalo của bạn ở đây
    const braceletPrice = 180000;    // Giá dây vòng

    // 2. DANH SÁCH CHARM VÀ LINK ẢNH THẬT
    // Bạn chỉ cần thay đoạn link trong ngoặc kép img: "..." bằng link từ Postimages (đuôi .png)
    const CHARM_CATEGORIES = [
      {
        category: "Hello Kitty",
        items: [
          { id: "kitty-1", name: "Kitty Đầu Vương Miện", price: 238000, img: "https://i.postimg.cc/YS7BcWzJ/IMG-0746.png" },
          { id: "kitty-2", name: "Kitty Nơ Đỏ", price: 238000, img: "https://i.postimg.cc/s2zCFh4b/IMG-0747.png" },
          { id: "kitty-3", name: "Kitty Thỏi Vàng", price: 238000, img: "https://i.postimg.cc/vmywRVtk/IMG-0748.png" },
          { id: "kitty-4", name: "Nơ Đỏ Thắt", price: 238000, img: "https://i.postimg.cc/SK4b0Mf5/IMG-0749.png" }
        ]
      },
      {
        category: "Biểu Tượng",
        items: [
          { id: "heart", name: "muỗng vàng", price: 238000, img: "https://i.postimg.cc/SK4b0Mf5/IMG-0749.png },
          { id: "star", name: "kitty bong bóng", price: 238000, img: "https://i.postimg.cc/5tJWcCSs/IMG-0750.png" }
        ]
      }
    ];

    let slots = [null, null, null, null, null];
    let activeSlot = 0;
    let currentTab = CHARM_CATEGORIES[0].category;

    function renderSlots() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '';
      slots.forEach((charm, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-11 h-11 rounded-full border-2 flex items-center justify-center transition-all relative ${
          activeSlot === idx ? 'border-pink-500 bg-pink-50 scale-110 shadow-md ring-2 ring-pink-200' : 'border-dashed border-gray-300 bg-white/80'
        }`;
        btn.onclick = () => { activeSlot = idx; updateUI(); };

        if (charm) {
          btn.innerHTML = `<img src="${charm.img}" class="w-8 h-8 object-contain" />
            <span onclick="event.stopPropagation(); removeCharm(${idx})" class="absolute -top-1 -right-1 bg-red-400 text-white rounded-full w-4 h-4 text-[9px] flex items-center justify-center">✕</span>`;
        } else {
          btn.innerHTML = `<span class="text-[10px] text-gray-400 font-bold">${idx + 1}</span>`;
        }
        container.appendChild(btn);
      });
      document.getElementById('active-slot-text').innerText = `Vị trí ${activeSlot + 1}`;
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';
      CHARM_CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${
          currentTab === cat.category ? 'bg-pink-500 text-white shadow-sm' : 'bg-gray-100 text-gray-500'
        }`;
        btn.innerText = cat.category;
        btn.onclick = () => { currentTab = cat.category; updateUI(); };
        container.appendChild(btn);
      });
    }

    function renderCharms() {
      const container = document.getElementById('charms-grid');
      container.innerHTML = '';
      const catData = CHARM_CATEGORIES.find(c => c.category === currentTab);
      if (!catData) return;

      catData.items.forEach(charm => {
        const btn = document.createElement('button');
        btn.className = 'flex flex-col items-center bg-pink-50/40 p-2 rounded-xl border border-pink-100 hover:bg-pink-100 transition active:scale-95';
        btn.onclick = () => selectCharm(charm);
        btn.innerHTML = `
          <img src="${charm.img}" class="w-10 h-10 object-contain mb-1" />
          <span class="text-[10px] font-medium text-gray-600 truncate w-full text-center">${charm.name}</span>
          <span class="text-[9px] text-pink-500 font-bold">${charm.price / 1000}k</span>
        `;
        container.appendChild(btn);
      });
    }

    function selectCharm(charm) {
      slots[activeSlot] = charm;
      if (activeSlot < slots.length - 1) activeSlot++;
      updateUI();
    }

    function removeCharm(idx) {
      slots[idx] = null;
      updateUI();
    }

    function calculateTotal() {
      const charmTotal = slots.reduce((acc, item) => acc + (item ? item.price : 0), 0);
      const total = braceletPrice + charmTotal;
      document.getElementById('total-price').innerText = total.toLocaleString() + ' đ';
      return total;
    }

    function updateUI() {
      renderSlots();
      renderTabs();
      renderCharms();
      calculateTotal();
    }

    function sendOrderZalo() {
      let msg = `✨ ĐƠN HÀNG THIẾT KẾ CHARM KIM BẢO DI ✨\n--------------------------\n`;
      msg += `1. Dây vòng bạc: ${braceletPrice.toLocaleString()}đ\n2. Charm đính kèm:\n`;
      let hasCharm = false;
      slots.forEach((item, idx) => {
        if (item) {
          hasCharm = true;
          msg += `  • Vị trí ${idx + 1}: ${item.name} (${item.price.toLocaleString()}đ)\n`;
        }
      });
      if (!hasCharm) msg += `  (Chưa chọn charm)\n`;
      msg += `--------------------------\n💰 TỔNG TIỀN: ${calculateTotal().toLocaleString()} VNĐ`;
      window.open(`https://zalo.me/${ZALO_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // Khởi chạy giao diện
    updateUI();
  </script>
</body>
</html>
